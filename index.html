<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Independent Bookstore Events</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Independent Bookstore Events</h1>
    <p>Discover upcoming events at your favorite bookstore.</p>
</header>

<section class="search-section">
    <input
        type="text"
        id="searchInput"
        placeholder="Search events..."
        aria-label="Search Events"
    >
    <button id="searchBtn">Search</button>
</section>

<div id="loading" class="loading">
    Loading events...
</div>

<div id="noData" class="hidden">
    No data found.
</div>

<section id="eventsContainer" class="events">

</section>

<section class="form-section">
    <h2>Register for an Event</h2>

    <form id="registerForm">

        <input
            type="text"
            id="name"
            placeholder="Your Name"
            aria-label="Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            aria-label="Email"
            required
        >

        <button type="submit">
            Register
        </button>

    </form>
</section>

<script src="script.js"></script>

</body>
</html>
